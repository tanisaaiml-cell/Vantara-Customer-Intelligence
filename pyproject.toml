[project]
name = "vantara-customer-intelligence"
version = "1.0.0"
requires-python = ">=3.11,<3.12"
[tool.ruff]
target-version = "py311"
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: real-data retraining and reproducibility integration"]
[tool.coverage.run]
source = ["src"]
