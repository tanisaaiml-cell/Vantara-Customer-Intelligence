seed: 42
raw_path: data/raw/online_retail_II.xlsx
cutoff: '2011-09-01'
horizon_days: 90
max_missing_customer_rate: 0.30
minimum_date: '2009-01-01'
maximum_date: '2012-01-01'
max_quantity: 50000
max_price: 20000
cv_folds: 5
test_fraction: 0.15
validation_fraction: 0.15
recall_target: 0.70
sequence_length: 12
cluster_k: [2, 3, 4, 5, 6]
anomaly_quantile: 0.95
dl: {epochs: 35, cv_epochs: 15, patience: 6, batch_size: 128, learning_rate: 0.001, hidden: 48, dropout: 0.25, weight_decay: 0.0001}
rf_grid:
  model__n_estimators: [180]
  model__max_depth: [6, null]
  model__min_samples_leaf: [3, 8]
xgb_grid:
  model__max_depth: [2, 3]
  model__learning_rate: [0.04, 0.08]
  model__subsample: [0.85]
  model__colsample_bytree: [0.85]
  model__n_estimators: [220]
models:
  logistic: {max_iter: 2500, class_weight: balanced, C: 0.2}
  tree: {max_depth: 5, min_samples_leaf: 25, class_weight: balanced}
  forest: {class_weight: balanced, n_jobs: 2}
  xgb: {eval_metric: logloss, n_jobs: 2}
  lgb: {n_estimators: 180, max_depth: 4, num_leaves: 12, learning_rate: 0.04, class_weight: balanced, verbosity: -1, n_jobs: 2}
  knn: {n_neighbors: 35, weights: distance}
  ridge: {alpha: 100}
  forest_value: {n_estimators: 250, max_depth: 9, min_samples_leaf: 4, n_jobs: 2}
  lgb_value: {n_estimators: 200, max_depth: 3, num_leaves: 7, learning_rate: 0.03, min_child_samples: 30, verbosity: -1, n_jobs: 2}
  category: {n_estimators: 160, max_depth: 8, min_samples_leaf: 6, class_weight: balanced, n_jobs: 2}
